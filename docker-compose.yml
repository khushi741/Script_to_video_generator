services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-generator-app
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - ALLOW_OFFLINE_FALLBACK=true
      - CORS_ORIGINS=*
    volumes:
      - ./storage:/app/storage
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: video-generator-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
