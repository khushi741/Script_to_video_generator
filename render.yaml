services:
  - type: web
    name: ai-explainer-video-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOW_OFFLINE_FALLBACK
        value: "true"
      - key: OLLAMA_HOST
        value: "http://localhost:11434"
      - key: OLLAMA_MODEL
        value: "llama3.1:8b"
      - key: CORS_ORIGINS
        value: "*"
